# /etc/systemd/system/hook-hub.service.d/litestream.conf
# Runs the hub under Litestream, which replicates the database continuously
# and stops the hub if replication can't start. Then:
#   systemctl daemon-reload && systemctl restart hook-hub
[Service]
EnvironmentFile=/etc/hook/litestream.env
ExecStart=
ExecStart=/usr/bin/litestream replicate -config /etc/litestream.yml -exec /usr/local/bin/hook-hub
